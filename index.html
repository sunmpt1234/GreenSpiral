<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบเช็คชื่อสีเขียว</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; font-family: 'Sarabun', sans-serif; background-color: #f8f9fa;}
    .container { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 800px; }
    .student-row { vertical-align: middle; }
    .attendance-check { cursor: pointer; }
    .btn-check-all { font-size: 0.85rem; padding: 0.25rem 0.5rem; margin-bottom: 5px; }
  </style>
</head>
<body>
  <div class="container mx-auto mt-4">
    <h2 class="mb-4 text-center text-success">ระบบเช็คชื่อสีเขียวนักเรียน</h2>
    
    <div class="row justify-content-center mb-4">
      <div class="col-md-8">
        <label for="classSelect" class="form-label fw-bold">เลือกระดับสายชั้น</label>
        <select id="classSelect" class="form-select" onchange="loadStudents()">
          <option value="">-- กำลังโหลดข้อมูล... --</option>
        </select>
      </div>
    </div>

    <div id="loading" class="text-center text-primary" style="display:none;">
      <div class="spinner-border spinner-border-sm" role="status"></div> กำลังโหลดข้อมูล...
    </div>

    <form id="attendanceForm" style="display:none;" onsubmit="submitAttendance(event)">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted fs-6">กรุณาทำเครื่องหมายเฉพาะคนที่มา</span>
        <div>
          <button type="button" class="btn btn-outline-success btn-check-all" onclick="toggleAll(true)">เลือกทั้งหมด</button>
          <button type="button" class="btn btn-outline-secondary btn-check-all" onclick="toggleAll(false)">ล้างทั้งหมด</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover border">
          <thead class="table-success">
            <tr>
              <th>รหัส</th>
              <th>ชื่อ-สกุล</th>
              <th class="text-center">สถานะ</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <!-- ข้อมูลนักเรียนจะแสดงที่นี่ -->
          </tbody>
        </table>
      </div>
      <button type="submit" class="btn btn-success w-100 py-2 fs-5 fw-bold" id="submitBtn">บันทึกการเช็คชื่อ</button>
    </form>
  </div>

  <script>
    // --- ใส่ URL ที่ได้จากการ Deploy Web App ของ Google Apps Script ตรงนี้ ---
    const GAS_URL = "วาง_URL_เว็บแอปของ_GAS_ที่นี่"; 
    
    window.onload = function() {
      fetch(`${GAS_URL}?action=getClasses`)
        .then(response => response.json())
        .then(result => {
          if(result.success) populateClasses(result.data);
          else alert("เกิดข้อผิดพลาดในการโหลดสายชั้น");
        })
        .catch(error => console.error('Error:', error));
    };

    function populateClasses(classes) {
      const select = document.getElementById('classSelect');
      select.innerHTML = '<option value="">-- กรุณาเลือกระดับสายชั้น --</option>';
      classes.forEach(c => {
        let option = document.createElement('option');
        option.value = c;
        option.textContent = c;
        select.appendChild(option);
      });
    }

    function loadStudents() {
      const selectedClass = document.getElementById('classSelect').value;
      if (!selectedClass) {
        document.getElementById('attendanceForm').style.display = 'none';
        return;
      }
      
      document.getElementById('loading').style.display = 'block';
      document.getElementById('attendanceForm').style.display = 'none';
      
      fetch(`${GAS_URL}?action=getStudents&grade=${selectedClass}`)
        .then(response => response.json())
        .then(result => {
          if(result.success) renderStudents(result.data);
          else alert("เกิดข้อผิดพลาดในการโหลดรายชื่อ");
        })
        .catch(error => {
          console.error('Error:', error);
          document.getElementById('loading').style.display = 'none';
        });
    }

    function renderStudents(students) {
      const tbody = document.getElementById('studentTableBody');
      tbody.innerHTML = ''; 
      
      students.forEach(student => {
        // เช็คสถานะ: ถ้าเคยเช็คชื่อว่า "มา" ไปแล้ว ให้ติ๊กถูกรอไว้เลย
        const isChecked = (student.status === 'มา') ? 'checked' : '';

        const row = document.createElement('tr');
        row.className = 'student-row';
        row.innerHTML = `
          <td>${student.id}</td>
          <td>${student.title}${student.firstName} ${student.lastName} <span class="badge bg-secondary ms-1">${student.fullClass}</span></td>
          <td class="text-center">
            <input class="form-check-input attendance-check border-success" type="checkbox" value="${student.id}" style="transform: scale(1.6);" ${isChecked}>
          </td>
        `;
        tbody.appendChild(row);
      });
      
      document.getElementById('loading').style.display = 'none';
      document.getElementById('attendanceForm').style.display = 'block';
    }

    function toggleAll(status) {
      const checkboxes = document.querySelectorAll('.attendance-check');
      checkboxes.forEach(cb => cb.checked = status);
    }

    function submitAttendance(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังบันทึก...';

      const selectedClass = document.getElementById('classSelect').value; 
      const checkboxes = document.querySelectorAll('.attendance-check');
      let attendanceData = [];
      
      checkboxes.forEach(cb => {
        attendanceData.push({
          id: cb.value,
          status: cb.checked ? 'มา' : 'ขาด' 
        });
      });

      fetch(GAS_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8' 
        },
        body: JSON.stringify({
          action: 'saveAttendance',
          selectedGrade: selectedClass,
          attendanceData: attendanceData
        })
      })
      .then(response => response.json())
      .then(result => {
        if(result.success) {
          alert(result.message);
          // เมื่อบันทึกเสร็จ ให้โหลดรายชื่อใหม่เพื่อแสดงข้อมูลล่าสุด
          loadStudents(); 
        } else {
          alert('เกิดข้อผิดพลาด: ' + result.message);
        }
      })
      .catch(error => {
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
        console.error('Error:', error);
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = 'บันทึกการเช็คชื่อ';
      });
    }
  </script>
</body>
</html>
